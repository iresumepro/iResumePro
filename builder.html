<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Resume Builder - iResumePro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h2>Resume Builder</h2>

<label>Full Name</label>
<input type="text" id="name" oninput="update()">

<label>Title</label>
<input type="text" id="title" oninput="update()">

<label>Contact</label>
<input type="text" id="contact" oninput="update()">

<label>Skills</label>
<input type="text" id="skills" oninput="update()">

<h3>Preview:</h3>
<div id="preview" style="border:1px solid #ccc; padding:10px;"></div>

<script>
function update() {
  document.getElementById("preview").innerHTML =
    "<h3>" + document.getElementById("name").value + "</h3>" +
    "<p>" + document.getElementById("title").value + "</p>" +
    "<p>" + document.getElementById("contact").value + "</p>" +
    "<p><b>Skills:</b> " + document.getElementById("skills").value + "</p>";
}
</script>

</body>
</html>
